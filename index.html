// ═══════════════════════════════════════════════
// STORAGE (IndexedDB via simple wrapper)
// ═══════════════════════════════════════════════
const DB_NAME = 'inspecao-predial';
const DB_STORE = 'data';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(DB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function dbGet(key) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}

async function dbSet(key, value) {
  const db = await openDB();
  return new Promise((resolve) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(value, key);
    tx.oncomplete = () => resolve();
  });
}

// ═══════════════════════════════════════════════
// SYNC
// ═══════════════════════════════════════════════
async function syncToSheets(data) {
  if (!SYNC_URL) return { error: 'SYNC_URL não configurada' };
  try {
    const iframe = document.createElement('iframe');
    iframe.name = 'sync_' + Date.now();
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = SYNC_URL;
    form.target = iframe.name;

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = 'data';
    input.value = JSON.stringify({ action: 'sync', payload: data });
    form.appendChild(input);

    document.body.appendChild(form);
    form.submit();
    form.remove();

    setTimeout(() => iframe.remove(), 5000);
    return { status: 'ok', timestamp: new Date().toLocaleString('pt-BR') };
  } catch (e) {
    return { error: e.message };
  }
}
